<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Network Lab Redesign</title>
<style>
:root{
  --bg:#0e141b; --panel:#161e28; --panel2:#1c2632; --line:#263341; --text:#e6edf3; --muted:#97a5b5;
  --accent:#4aa3ff; --accent-ink:#04121f; --good:#3fb97a; --warn:#e3b341; --bad:#f0616d; --bad-bg:#2e171c;
  --scrim:rgba(5,9,14,.62); --radius:12px; color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e141b; --panel:#161e28; --panel2:#1c2632; --line:#263341; --text:#e6edf3; --muted:#97a5b5;
    --accent:#4aa3ff; --accent-ink:#04121f; --good:#3fb97a; --warn:#e3b341; --bad:#f0616d; --bad-bg:#2e171c;
    --scrim:rgba(5,9,14,.62);
  }
}
:root[data-theme="dark"]{
  --bg:#0e141b; --panel:#161e28; --panel2:#1c2632; --line:#263341; --text:#e6edf3; --muted:#97a5b5;
  --accent:#4aa3ff; --accent-ink:#04121f; --good:#3fb97a; --warn:#e3b341; --bad:#f0616d; --bad-bg:#2e171c;
  --scrim:rgba(5,9,14,.62);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:650;line-height:1.2}
h1{font-size:1.5rem} h2{font-size:1.1rem} h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.86rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* layout */
.app{display:grid;grid-template-columns:188px minmax(0,1fr);grid-template-rows:56px minmax(0,1fr);min-height:100vh}
.top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;min-width:0}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;flex:none}
.brand{font-weight:650;flex:none}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);min-width:0;max-width:100%}
.pill span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--good);box-shadow:0 0 0 3px rgba(63,185,122,.2)}
.dot.bad{background:var(--bad)}
.grow{flex:1;min-width:0}
.btn{min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:600}
.btn:hover{border-color:#3a4b5e}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#26070b}
.btn.ghost{background:transparent}
.btn.small{min-height:34px;padding:0 12px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;min-height:40px}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .track{width:42px;height:24px;border-radius:99px;background:#33414f;position:relative;flex:none;transition:background .15s}
.sw .track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+.track{background:var(--good)}
.sw input:checked+.track::after{transform:translateX(18px)}
.sw input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:2px}
.kbd{font-size:.74rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--muted);background:var(--panel2)}

.rail{padding:14px 10px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;position:sticky;top:56px;align-self:start;height:calc(100vh - 56px)}
.rail a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;min-height:44px}
.rail a:hover{background:var(--panel)}
.rail a[aria-current="page"]{background:var(--panel2);color:var(--text)}
.rail svg,.tabbar svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.tabbar{display:none}
main{padding:24px;min-width:0;max-width:1100px;width:100%}
.view{display:none} .view.on{display:block}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head .grow{min-width:200px}
.stack{display:grid;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:var(--radius);background:var(--bad-bg);border:1px solid #5a2a33;margin-bottom:16px}
.banner .grow{min-width:180px}

/* now */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.hero .big{min-width:150px;min-height:64px;font-size:1.15rem;border-radius:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
.dcard{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.dcard:hover{border-color:#3a4b5e}
.dcard .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dcard b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
svg.spark{display:block;width:100%;height:44px;margin:8px 0 4px}
svg.spark.sm{height:26px;margin:0;width:70px}
svg.spark path{fill:none;stroke:var(--accent);stroke-width:1.6;vector-effect:non-scaling-stroke}
svg.spark.lg{height:90px}
.stats{display:flex;gap:14px;flex-wrap:wrap}
.stat b{font-size:1.1rem;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;border:1px solid var(--line);background:var(--panel2);color:var(--muted);white-space:nowrap}
.tag.good{color:var(--good);border-color:#285a40}
.tag.warn{color:var(--warn)}
.check{display:grid;gap:8px;margin-top:10px}
.check li{list-style:none;display:flex;gap:10px;align-items:center}
.check ul{margin:0;padding:0}
.tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:.75rem}
.tick.done{background:var(--good);border-color:var(--good);color:#04160d}
.bar{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--good)}

/* devices */
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.input{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);width:100%}
select.input{appearance:auto}
.tools .input{flex:1 1 200px;width:auto}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.strip{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;margin-bottom:14px}
.strip select{width:auto;flex:0 1 240px}
.list{display:grid;gap:8px}
.drow{display:grid;grid-template-columns:36px minmax(0,1fr) auto 70px 14px;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;min-height:60px}
.drow:hover{border-color:#3a4b5e}
.drow .ico{width:36px;height:36px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;color:var(--muted);font-size:.75rem;font-weight:700}
.drow .nm{min-width:0}
.drow .nm b,.drow .nm span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:var(--muted)}
.empty{padding:28px 16px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:4px}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--panel);border-left:1px solid var(--line);z-index:41;transform:translateX(105%);transition:transform .2s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{padding:16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.drawer .body{padding:16px;overflow:auto;flex:1;display:grid;gap:16px;align-content:start}
.handle{display:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;color:var(--muted);font-weight:600;min-height:44px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-color:var(--accent)}
.sect{display:grid;gap:8px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.kv:last-child{border:0}
.kv .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.result{padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}

/* profiles */
.pc{display:flex;flex-direction:column;gap:8px;text-align:left;min-height:130px}
.pc .acts{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{display:flex;justify-content:space-between;font-weight:600}
.field output{color:var(--accent);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);min-height:28px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}

/* palette, toasts, modal */
.pal{position:fixed;inset:0;z-index:60;background:var(--scrim);display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 0}
.pal.on{display:flex}
.pal .box{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 16px;font-size:1rem;outline:none}
.pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.pal li{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;min-height:40px;align-items:center}
.pal li[aria-selected="true"]{background:var(--panel2)}
.pal li small{color:var(--muted)}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:80;display:grid;gap:8px;width:min(440px,calc(100vw - 32px))}
.toast{display:flex;gap:12px;align-items:center;padding:10px 12px 10px 16px;background:#233142;border:1px solid #34475c;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.toast span{flex:1;min-width:0}
.toast.err{border-color:#7a3340}
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:var(--scrim);padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(440px,100%);display:grid;gap:12px;max-height:90vh;overflow:auto}
.skel{background:linear-gradient(90deg,var(--panel) 25%,var(--panel2) 50%,var(--panel) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--radius);height:96px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){.skel{animation:none}.drawer{transition:none}}
details summary{cursor:pointer;color:var(--muted);min-height:36px;display:flex;align-items:center}

@media (max-width:700px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:56px minmax(0,1fr)}
  .rail,.brand,#palBtn,.hide-m{display:none}
  .top{padding:0 16px;gap:8px}
  main{padding:16px 16px calc(84px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:60px;color:var(--muted);text-decoration:none;font-size:.72rem;font-weight:600;position:relative}
  .tabbar a[aria-current="page"]{color:var(--accent)}
  .tabbar .badge{position:absolute;top:10px;left:calc(50% + 8px);margin:0}
  .toasts{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero .big{width:100%}
  .cols{grid-template-columns:minmax(0,1fr)}
  .drow{grid-template-columns:36px minmax(0,1fr) 14px;padding:10px 12px}
  .drow .tag,.drow svg.spark.sm{display:none}
  .drawer{top:auto;left:0;right:0;width:100%;max-height:88vh;height:88vh;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(105%)}
  .drawer.on{transform:none}
  .handle{display:block;width:44px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0}
  .btn,.chip,.sw{min-height:44px}
  .btn.small{min-height:40px}
  h1{font-size:1.3rem}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top" role="banner">
    <div class="logo" aria-hidden="true">N</div>
    <div class="brand">Network Lab</div>
    <div class="grow"><div class="pill" id="status" role="status" aria-live="polite"></div></div>
    <label class="sw" title="Home router Wi-Fi"><input type="checkbox" id="routerSw" aria-label="Router Wi-Fi"><span class="track"></span><span class="hide-m small">Router Wi-Fi</span></label>
    <button class="btn danger" id="panic" aria-label="Panic: stop everything">Panic</button>
    <button class="btn ghost" id="palBtn" aria-label="Search and commands">Search <span class="kbd">Ctrl K</span></button>
  </header>

  <nav class="rail" aria-label="Main" id="rail"></nav>

  <main id="main">
    <section class="view" id="v-now" aria-label="Now"></section>
    <section class="view" id="v-devices" aria-label="Devices"></section>
    <section class="view" id="v-profiles" aria-label="Profiles"></section>
    <section class="view" id="v-network" aria-label="Network"></section>
    <section class="view" id="v-more" aria-label="More"></section>
  </main>
</div>
<nav class="tabbar" aria-label="Main" id="tabbar"></nav>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Device details" aria-hidden="true"></aside>
<div class="pal" id="pal" role="dialog" aria-label="Command palette"><div class="box"><input id="palIn" placeholder="Type a command or a device name" aria-label="Command"><ul id="palList" role="listbox"></ul></div></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="box" id="modalBox"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- fake state ---------- */
const S={
  running:true, panic:false, general:"cafe", router:true, routerPw:false, knownOnly:false, dns:0, updateReady:true,
  presets:{
    normal:{name:"Normal",delay:0,jitter:0,loss:0,rate:100,custom:false},
    cafe:{name:"Busy café Wi-Fi",delay:120,jitter:40,loss:2,rate:5},
    hotel:{name:"Hotel Wi-Fi",delay:80,jitter:60,loss:4,rate:3},
    train:{name:"Train tunnel",delay:300,jitter:150,loss:12,rate:1},
    g3:{name:"Slow 3G",delay:400,jitter:100,loss:1,rate:0.4}
  },
  services:{cafe:[],hotel:[],train:["Instagram"],g3:[],normal:[]},
  devices:[
    {id:"pixel",name:"Pixel 8",kind:"Phone",ip:"192.168.50.31",profile:"follow",prot:false,blocked:[]},
    {id:"anna",name:"Anna’s iPhone",kind:"Phone",ip:"192.168.50.32",profile:"follow",prot:false,blocked:[]},
    {id:"think",name:"ThinkPad X1",kind:"Laptop",ip:"192.168.50.40",profile:"train",prot:false,blocked:[]},
    {id:"mac",name:"Owner’s MacBook",kind:"Laptop",ip:"192.168.50.20",profile:"follow",prot:true,blocked:[]},
    {id:"tv",name:"Living-room TV",kind:"TV",ip:"192.168.50.55",profile:"follow",prot:false,blocked:[]},
    {id:"unk",name:"Unnamed client",kind:"Unknown",ip:"192.168.50.61",profile:"follow",prot:false,blocked:[]}
  ],
  check:{pick:false,connect:true,start:true,impact:false,hide:false}
};
const NAMES=[["api.myapp.dev","420 kB/s"],["instagram.com","310 kB/s"],["youtube.com","1.2 MB/s"],["spotify.com","96 kB/s"],["apple.com","24 kB/s"],["graph.facebook.com","58 kB/s"]];
const LOG=[]; const H={}; const CHK={}; const EDIT={};
let view="now", openDev=null, devFilter="all", devQuery="", dtab="overview", editing=null, etab="settings", moreTab="updates", skeleton=true;

function snap(){return JSON.stringify(S)}
function restore(j){const o=JSON.parse(j);for(const k in S)delete S[k];Object.assign(S,o)}
function log(t){LOG.unshift({t:new Date(),text:t});if(LOG.length>40)LOG.pop()}

/* ---------- derived ---------- */
function effKey(d){ if(S.panic||!S.running||d.prot)return "normal"; return d.profile==="follow"?S.general:d.profile }
function eff(d){return S.presets[effKey(d)]||S.presets.normal}
function affected(d){return effKey(d)!=="normal"}
function profName(k){return (S.presets[k]||{name:"Normal"}).name}
function devById(id){return S.devices.find(d=>d.id===id)}
function sample(p){
  const base=10+Math.random()*4;
  if(!p.delay&&!p.loss)return base;
  if(Math.random()*100<p.loss)return null;
  return Math.max(base,base+p.delay+(Math.random()*2-1)*p.jitter);
}
function ensureH(id,p){ if(!H[id]){H[id]=[];for(let i=0;i<60;i++)H[id].push(sample(p))} return H[id] }
function sparkD(a,w=120,h=32){
  const CAP=700,n=a.length;let d="";
  a.forEach((v,i)=>{const val=v==null?CAP:Math.min(v,CAP);const fr=Math.sqrt(val/CAP);const x=(i*(w/(n-1))).toFixed(1),y=(h-2-(h-4)*fr).toFixed(1);d+=(i?"L":"M")+x+" "+y});
  return d;
}
function stat(a){
  const ok=a.slice(-20).filter(v=>v!=null);const ms=ok.length?Math.round(ok.reduce((s,v)=>s+v,0)/ok.length):0;
  const loss=Math.round(a.filter(v=>v==null).length/a.length*100);return{ms,loss};
}
function spark(id,cls=""){return `<svg class="spark ${cls}" viewBox="0 0 120 32" preserveAspectRatio="none" role="img" aria-label="Live delay"><path data-spark="${id}" d=""/></svg>`}

/* ---------- icons ---------- */
const IC={
  now:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  devices:'<svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg>',
  profiles:'<svg viewBox="0 0 24 24"><path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/></svg>',
  network:'<svg viewBox="0 0 24 24"><path d="M3 9a14 14 0 0 1 18 0M6 12.5a9.5 9.5 0 0 1 12 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19" r="1"/></svg>',
  more:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>'
};
const PLACES=[["now","Now"],["devices","Devices"],["profiles","Profiles"],["network","Network"],["more","More"]];
function navHtml(){return PLACES.map(([k,l])=>`<a href="#${k}" data-nav="${k}" ${view===k?'aria-current="page"':''}>${IC[k]}<span>${l}</span>${k==="more"&&S.updateReady?'<i class="badge" title="Update ready"></i>':''}</a>`).join("")}

/* ---------- actions with undo ---------- */
function commit(label,fn){
  const before=snap();fn();log(label);render();toast(label,()=>{restore(before);log("Undid: "+label);render();toast("Undone")});
}
function toast(msg,undo,err){
  const t=document.createElement("div");t.className="toast"+(err?" err":"");
  t.innerHTML=`<span>${esc(msg)}</span>`;
  if(undo){const b=document.createElement("button");b.className="btn small ghost";b.textContent="Undo";b.onclick=()=>{undo();t.remove()};t.appendChild(b)}
  const box=$("#toasts");box.innerHTML="";box.appendChild(t);
  setTimeout(()=>{if(t.parentNode)t.remove()},6000);
}
const A={
  toggleRun(){ if(S.panic){commit("Started again. Saved settings are on",()=>{S.panic=false;S.running=true;S.check.start=true})}
    else if(S.running)commit("Stopped. All devices are back to normal",()=>{S.running=false});
    else commit("Started with "+profName(S.general),()=>{S.running=true;S.check.start=true}) },
  panic(){ if(S.panic)return; commit("Panic: everything is stopped",()=>{S.panic=true;S.running=false}) },
  general(k){ commit(profName(k)+" for everyone",()=>{S.general=k;S.check.pick=true}) },
  router(on){
    if(!S.routerPw){ $("#routerSw").checked=S.router; askPassword(on); return }
    commit("Router Wi-Fi "+(on?"on":"off"),()=>{S.router=on});
  },
  devProfile(id,k){ const d=devById(id); commit(d.name+" "+(k==="follow"?"follows everyone":"now on "+profName(k)),()=>{d.profile=k;S.check.pick=true}) },
  protect(id,on){ const d=devById(id); commit(d.name+(on?" is protected":" is no longer protected"),()=>{d.prot=on}) },
  block(id,name){ const d=devById(id); const has=d.blocked.includes(name);
    commit((has?"Unblocked ":"Blocked ")+name+" on "+d.name,()=>{d.blocked=has?d.blocked.filter(x=>x!==name):[...d.blocked,name]}) },
  checkNow(id){ const d=devById(id); CHK[id]={busy:true}; renderDrawer();
    setTimeout(()=>{const s=stat(ensureH(id,eff(d)));CHK[id]={ms:s.ms,loss:s.loss,aff:affected(d)};S.check.impact=true;log("Checked impact on "+d.name);renderDrawer();if(view==="now")renderNow()},900) }
};

/* ---------- live ticking: only touches SVG paths and numbers ---------- */
function tick(noPush){
  S.devices.forEach(d=>{const p=eff(d);const a=ensureH(d.id,p);if(!noPush){a.push(sample(p));a.shift()}
    $$(`[data-spark="${d.id}"]`).forEach(el=>el.setAttribute("d",sparkD(a)));
    const s=stat(a);$$(`[data-ms="${d.id}"]`).forEach(el=>el.textContent=s.ms);$$(`[data-loss="${d.id}"]`).forEach(el=>el.textContent=s.loss)});
  const pp=$("#prevPath");if(pp&&editing){const p=S.presets[editing];if(!noPush){EDIT.h.push(sample(p));EDIT.h.shift()}
    pp.setAttribute("d",sparkD(EDIT.h));const s=stat(EDIT.h);$("#prevMs").textContent=s.ms;$("#prevLoss").textContent=s.loss}
}
setInterval(()=>{if(!document.hidden)tick()},900);

/* ---------- palette ---------- */
let palSel=0,palItems=[];
function commands(){
  const c=[];
  PLACES.forEach(([k,l],i)=>c.push({t:"Go to "+l,k:"g "+"ndpwm"[i],run:()=>go(k)}));
  c.push({t:S.running?"Stop":"Start",run:A.toggleRun});
  c.push({t:"Panic: stop everything",run:A.panic});
  c.push({t:"Router Wi-Fi "+(S.router?"off":"on"),run:()=>A.router(!S.router)});
  Object.entries(S.presets).forEach(([k,p])=>c.push({t:"Use "+p.name+" for everyone",run:()=>A.general(k)}));
  S.devices.forEach(d=>{c.push({t:"Open "+d.name,run:()=>{go("devices");open(d.id)}});c.push({t:(d.prot?"Unprotect ":"Protect ")+d.name,run:()=>A.protect(d.id,!d.prot)})});
  c.push({t:"Check for updates",run:()=>{go("more");moreTab="updates";render()}});
  c.push({t:"Show shortcuts",k:"?",run:helpModal});
  return c;
}
function palRender(){
  const q=$("#palIn").value.toLowerCase().trim();
  palItems=commands().filter(c=>!q||q.split(/\s+/).every(w=>c.t.toLowerCase().includes(w))).slice(0,30);
  palSel=Math.min(palSel,Math.max(0,palItems.length-1));
  $("#palList").innerHTML=palItems.length?palItems.map((c,i)=>`<li role="option" data-i="${i}" aria-selected="${i===palSel}"><span>${esc(c.t)}</span>${c.k?`<small>${esc(c.k)}</small>`:""}</li>`).join(""):'<li class="muted">No command matches</li>';
}
function palOpen(){$("#pal").classList.add("on");$("#palIn").value="";palSel=0;palRender();$("#palIn").focus()}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target;let el;
  if((el=t.closest("[data-nav]"))){e.preventDefault();go(el.dataset.nav);return}
  if((el=t.closest("[data-open]"))){open(el.dataset.open);return}
  if((el=t.closest("[data-gen]"))){A.general(el.dataset.gen);return}
  if((el=t.closest("[data-filter]"))){devFilter=el.dataset.filter;renderDevices(false);return}
  if((el=t.closest("[data-dtab]"))){dtab=el.dataset.dtab;renderDrawer();tick(true);return}
  if((el=t.closest("[data-etab]"))){etab=el.dataset.etab;renderEditor();tick(true);return}
  if((el=t.closest("[data-mtab]"))){moreTab=el.dataset.mtab;renderMore();return}
  if((el=t.closest("[data-edit]"))){editing=el.dataset.edit;etab="settings";EDIT.h=null;renderProfiles();tick(true);return}
  if((el=t.closest("[data-check]"))){A.checkNow(el.dataset.check);return}
  if((el=t.closest("[data-block]"))){A.block(openDev,el.dataset.block);renderDrawer();return}
  if((el=t.closest("#palList li[data-i]"))){palRun(+el.dataset.i);return}
  if(t.id==="scrim"){closeDrawer();return}
  if(t.id==="pal"){palClose();return}
  if(t.id==="panic"||t.closest("#panic")){A.panic();return}
  if(t.closest("#palBtn")){palOpen();return}
  if((el=t.closest("[data-act]"))){
    const a=el.dataset.act;
    ({run:A.toggleRun,closeDrawer,closeModal,hideCheck(){S.check.hide=true;renderNow()},clearFilter(){devFilter="all";devQuery="";renderDevices(false)},
      backProfiles(){editing=null;renderProfiles()},
      newProfile(){const k="p"+Date.now();commit("Created a new profile",()=>{S.presets[k]={name:"New profile",delay:100,jitter:20,loss:1,rate:10};S.services[k]=[]});editing=k;etab="settings";EDIT.h=null;renderProfiles();tick(true)},
      fakeSched(){toast("Schedules are not part of this prototype")},fakeReset(){toast("Not part of this prototype")},fakeAccess(){toast("Not part of this prototype")},
      askPw(){askPassword(!S.router)},install(){commit("Installed 1.9.0",()=>{S.updateReady=false})},checkUpd(){toast("You are on the newest approved version")},signout(){toast("Signed out (pretend)")}
    })[a]?.();
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="routerSw"){A.router(t.checked);return}
  if(t.id==="genSel"){A.general(t.value);return}
  if(t.id==="devProf"){A.devProfile(openDev,t.value);return}
  if(t.id==="devProt"){A.protect(openDev,t.checked);return}
  if(t.id==="knownOnly"){commit("Only known devices can join: "+(t.checked?"on":"off"),()=>{S.knownOnly=t.checked});return}
  if(t.id==="dns"){commit("DNS failures set to "+t.value+"%",()=>{S.dns=+t.value});return}
  if(t.dataset&&t.dataset.svc){const k=editing,n=t.dataset.svc;commit((t.checked?"Blocked ":"Unblocked ")+n+" on "+S.presets[k].name,()=>{const a=S.services[k]||(S.services[k]=[]);S.services[k]=t.checked?[...new Set([...a,n])]:a.filter(x=>x!==n)});return}
  if(editing&&["delay","jitter","loss","rate"].includes(t.id)){const before=snap(),k=editing;const old=S.presets[k][t.id];
    S.presets[k][t.id]=+t.value;log(S.presets[k].name+": "+t.id+" "+t.value);toast(S.presets[k].name+": "+t.id+" is now "+t.value,()=>{restore(before);render()});renderStatus();return}
  if(t.id==="pname"){const before=snap();S.presets[editing].name=t.value.trim()||"Untitled";toast("Renamed",()=>{restore(before);render()});return}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="devQ"){devQuery=t.value;renderDevices(true);return}
  if(t.id==="palIn"){palSel=0;palRender();return}
  if(t.id==="dns"){$("#dnsO").textContent=t.value+"%";return}
  if(editing&&["delay","jitter","loss","rate"].includes(t.id)){const u={delay:"ms",jitter:"ms",loss:"%",rate:"Mbps"}[t.id];$("#"+t.id+"O").textContent=t.value+" "+u;
    S.presets[editing][t.id]=+t.value;H.__dirty=1;EDIT.h=Array.from({length:60},()=>sample(S.presets[editing]));tick(true)}
});
document.addEventListener("keydown",e=>{
  const typing=/INPUT|SELECT|TEXTAREA/.test((e.target.tagName||""))&&e.target.id!=="palIn";
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#pal").classList.contains("on")?palClose():palOpen();return}
  if($("#pal").classList.contains("on")){
    if(e.key==="Escape"){palClose();return}
    if(e.key==="ArrowDown"){e.preventDefault();palSel=Math.min(palItems.length-1,palSel+1);palRender();return}
    if(e.key==="ArrowUp"){e.preventDefault();palSel=Math.max(0,palSel-1);palRender();return}
    if(e.key==="Enter"){e.preventDefault();palRun(palSel)}
    return;
  }
  if(e.key==="Escape"){if($("#modal").classList.contains("on"))closeModal();else if(openDev)closeDrawer();return}
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="/"){e.preventDefault();palOpen();return}
  if(e.key==="?"){helpModal();return}
  if(window.__g){const m={n:"now",d:"devices",p:"profiles",w:"network",m:"more"}[e.key];window.__g=0;if(m)go(m);return}
  if(e.key==="g"){window.__g=1;setTimeout(()=>window.__g=0,900)}
});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});

/* ---------- start ---------- */
(function init(){
  const v=location.hash.slice(1);if(PLACES.some(p=>p[0]===v))view=v;
  render();
  setTimeout(()=>{skeleton=false;if(view==="now")renderNow();tick(true)},500);
})();
})();
</script>
</body>
</html>

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jittersim"
version = "0.1.0"
description = "A controlled network impairment simulator for Raspberry Pi test networks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
authors = [
  { name = "Samantha Martínez" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]


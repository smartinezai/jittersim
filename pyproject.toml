[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jittersim"
version = "0.1.0"
description = "A controlled network impairment simulator for Raspberry Pi test networks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "TBD" }
authors = [
  { name = "Samantha Martínez" },
]
dependencies = [
    "pycryptodome>=3.14,<4",
    "requests>=2.25,<3",
]

[project.scripts]
jittersim = "jittersim.cli:main"
jittersim-dashboard = "jittersim.api.server:main"
jittersim-helper = "jittersim.networking.helper:main"
jittersim-browser-proxy = "jittersim.networking.browser_proxy:main"
jittersim-reset = "jittersim.cli:reset_main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

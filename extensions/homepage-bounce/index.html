<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homepage bounce test</title>
<style>
  body { font: 16px system-ui; max-width: 42rem; min-width: 20rem; margin: 2rem auto;
    padding: 0 1rem; background: #14202c; color: #e5edf4; }
  section { margin: 1.3rem 0; padding: 1rem; border: 1px solid #617181; border-radius: .5rem; }
  button, input { font: inherit; margin: .4rem .3rem .4rem 0; padding: .55rem; }
  button { cursor: pointer; }
  input { max-width: 100%; box-sizing: border-box; }
  #status { min-height: 3rem; }
</style>
<main>
  <h1>Homepage bounce test</h1>
  <p>Pair on the test Wi-Fi. Only explicitly enrolled test pages are eligible.</p>
  <p>Chrome extension ID: <output id="extension-id"></output></p>
  <section aria-label="Pairing">
    <label for="pair-code">Disposable pairing code</label><br>
    <input id="pair-code" type="password" autocomplete="off" maxlength="32">
    <button id="pair">Pair device</button>
  </section>
  <section aria-label="Test controls">
    <button id="enable">Enable test effect</button>
    <button id="off">Off</button>
    <p id="status" role="status" aria-live="polite">Off by default.</p>
  </section>
  <section aria-label="Enrolled test pages">
    <p>Open a controlled test page. A selected bounce opens that site's home page.</p>
    <div id="test-pages"></div>
  </section>
</main>
<script src="page.js"></script>
</html>

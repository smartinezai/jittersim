name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version, and the versions on Raspberry Pi OS
        # Bookworm and Trixie.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: python -m unittest discover -s tests

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.6,<1"
      # Only errors that break code: syntax errors, undefined names and
      # definitions that replace each other. Long lines are a separate backlog.
      - run: ruff check --select E9,F63,F7,F82,F811 src tests

  linux:
    name: Linux datapath
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./tests/kernel/run-in-docker.sh
